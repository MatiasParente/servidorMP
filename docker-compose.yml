services:

  # ==========================================================
  # NGINX PROXY MANAGER
  # ==========================================================

  nginx:
    image: jc21/nginx-proxy-manager:2.12.6
    container_name: vps_nginx
    restart: unless-stopped

    ports:
      - "80:80"
      - "81:81"
      - "443:443"

    volumes:
      - ./infraestructura/nginx/data:/data
      - ./infraestructura/nginx/letsencrypt:/etc/letsencrypt

    networks:
      - proxy

  # ==========================================================
  # MARIADB
  # ==========================================================

  mariadb:
    image: mariadb:11.8
    container_name: vps_mariadb
    restart: unless-stopped

    env_file:
      - .env

    environment:
      TZ: ${TZ}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}

    volumes:
      - ./infraestructura/mariadb/data:/var/lib/mysql

    networks:
      - internal

  # ==========================================================
  # PHPMYADMIN
  # ==========================================================

  phpmyadmin:
    image: phpmyadmin:5.2.2-apache
    container_name: vps_phpmyadmin
    restart: unless-stopped

    environment:
      PMA_HOST: mariadb

    depends_on:
      - mariadb

    networks:
      - proxy
      - internal

    expose:
      - "80"

  # ==========================================================
  # MOSQUITTO
  # ==========================================================

  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: vps_mosquitto
    restart: unless-stopped

    env_file:
      - .env

    environment:
      TZ: ${TZ}

    ports:
      - "1883:1883"

    volumes:
      - ./infraestructura/mosquitto/config:/mosquitto/config
      - ./infraestructura/mosquitto/data:/mosquitto/data
      - ./infraestructura/mosquitto/log:/mosquitto/log

    networks:
      - internal

  # ==========================================================
  # NODE RED
  # ==========================================================

  node-red:
    image: nodered/node-red:4.1.1
    container_name: vps_nodered
    restart: unless-stopped

    env_file:
      - .env

    environment:
      TZ: ${TZ}

    volumes:
      - ./herramientas/node-red/data:/data

    depends_on:
      - mosquitto

    networks:
      - proxy
      - internal

    expose:
      - "1880"

  # ==========================================================
  # N8N
  # ==========================================================

  n8n:
    image: docker.n8n.io/n8nio/n8n:1.107.4
    container_name: vps_n8n
    restart: unless-stopped

    env_file:
      - .env

    environment:

      TZ: ${TZ}

      N8N_PATH: /n8n/

      N8N_PROTOCOL: https

      N8N_HOST: ${TAILNET_DOMAIN}

      WEBHOOK_URL: https://${TAILNET_DOMAIN}/n8n/

      N8N_EDITOR_BASE_URL: https://${TAILNET_DOMAIN}/n8n/

      N8N_SECURE_COOKIE: false

      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}

      DB_TYPE: mysqldb
      DB_MYSQLDB_HOST: mariadb
      DB_MYSQLDB_PORT: 3306
      DB_MYSQLDB_DATABASE: ${MYSQL_DATABASE}
      DB_MYSQLDB_USER: ${MYSQL_USER}
      DB_MYSQLDB_PASSWORD: ${MYSQL_PASSWORD}

    volumes:
      - ./herramientas/n8n/data:/home/node/.n8n

    depends_on:
      - mariadb

    networks:
      - proxy
      - internal

    expose:
      - "5678"

networks:

  proxy:

  internal: