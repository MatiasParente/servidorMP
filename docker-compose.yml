services:

  # ==========================================================
  # NGINX PROXY MANAGER
  # ==========================================================

  nginx:
    image: jc21/nginx-proxy-manager:2.15.1
    container_name: vps_nginx
    restart: unless-stopped

    ports:
      - "80:80"
      - "81:81"
      - "443:443"

    volumes:
      - ./infraestructura/nginx/data:/data
      - ./infraestructura/nginx/letsencrypt:/etc/letsencrypt

    networks:
      - proxy

  # ==========================================================
  # MARIADB
  # ==========================================================

  mariadb:
    image: mariadb:11.8
    container_name: vps_mariadb
    restart: unless-stopped

    env_file:
      - .env

    environment:
      TZ: ${TZ}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}

    volumes:
      - ./infraestructura/mariadb/data:/var/lib/mysql

    networks:
      - internal

  # ==========================================================
  # PHPMYADMIN
  # ==========================================================

  phpmyadmin:
    image: phpmyadmin:5.2.3
    container_name: vps_phpmyadmin
    restart: unless-stopped

    environment:
      PMA_HOST: mariadb
      PMA_ABSOLUTE_URI: https://${TAILNET_DOMAIN}/phpmyadmin/

    depends_on:
      - mariadb

    networks:
      - proxy
      - internal

    expose:
      - "80"

  # ==========================================================
  # MOSQUITTO
  # ==========================================================

  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: vps_mosquitto
    restart: unless-stopped

    env_file:
      - .env

    environment:
      TZ: ${TZ}

    ports:
      - "1883:1883"

    volumes:
      - ./infraestructura/mosquitto/config:/mosquitto/config
      - ./infraestructura/mosquitto/data:/mosquitto/data
      - ./infraestructura/mosquitto/log:/mosquitto/log

    networks:
      - internal

  # ==========================================================
  # NODE RED
  # ==========================================================

  node-red:
    image: nodered/node-red:5.0.4
    container_name: vps_nodered
    restart: unless-stopped

    env_file:
      - .env

    environment:
      TZ: ${TZ}

    volumes:
      - ./herramientas/node-red/data:/data

    depends_on:
      - mosquitto

    networks:
      - proxy
      - internal

    expose:
      - "1880"

  # ==========================================================
  # N8N
  # ==========================================================

  n8n:
    image: docker.n8n.io/n8nio/n8n:2.28.2
    container_name: vps_n8n
    restart: unless-stopped

    env_file:
      - .env

    environment:

      TZ: ${TZ}

      N8N_PATH: /n8n/

      N8N_PROTOCOL: https

      N8N_HOST: ${TAILNET_DOMAIN}

      WEBHOOK_URL: https://${TAILNET_DOMAIN}/n8n/

      N8N_EDITOR_BASE_URL: https://${TAILNET_DOMAIN}/n8n/

      N8N_SECURE_COOKIE: false

      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}

      DB_TYPE: mysqldb
      DB_MYSQLDB_HOST: mariadb
      DB_MYSQLDB_PORT: 3306
      DB_MYSQLDB_DATABASE: ${MYSQL_DATABASE}
      DB_MYSQLDB_USER: ${MYSQL_USER}
      DB_MYSQLDB_PASSWORD: ${MYSQL_PASSWORD}

    volumes:
      - ./herramientas/n8n/data:/home/node/.n8n

    depends_on:
      - mariadb

    networks:
      - proxy
      - internal

    expose:
      - "5678"

  # ==========================================================
  # HOMEPAGE DASHBOARD
  # ==========================================================

  homepage:

    image: nginx:alpine

    container_name: vps_homepage

    restart: unless-stopped

    volumes:
      - ./pagina/html:/usr/share/nginx/html:ro

    networks:
      - proxy

    expose:
      - "80"

  # ==========================================================
# FREEZERGUARD
# ==========================================================

  freezerguard:
    image: freezerguard:local
    build:
      context: ./proyectos
      dockerfile: ../docker/freezerguard/Dockerfile
    container_name: vps_freezerguard
    restart: unless-stopped

    env_file:
      - ./proyectos/FreezerGuard/.env

    volumes:
      - ./proyectos/FreezerGuard:/var/www/html

    networks:
      - freezerguard
      - internal

    expose:
      - "9000"

  # ==========================================================
  # FREEZERGUARD NGINX
# ==========================================================

  freezerguard-nginx:
    image: nginx:alpine
    container_name: vps_freezerguard_nginx
    restart: unless-stopped

    volumes:
      - ./proyectos/FreezerGuard:/var/www/html:ro
      - ./docker/freezerguard/nginx.conf:/etc/nginx/conf.d/default.conf:ro

    depends_on:
      - freezerguard

    networks:
      - proxy
      - freezerguard

    expose:
      - "80"

  # ==========================================================
  # FREEZERGUARD SCHEDULER & WORKER
  # ==========================================================

  freezerguard-scheduler:
    image: freezerguard:local
    container_name: vps_freezerguard_scheduler
    restart: unless-stopped
    command: php artisan schedule:work
    env_file:
      - ./proyectos/FreezerGuard/.env
    volumes:
      - ./proyectos/FreezerGuard:/var/www/html
    networks:
      - freezerguard
      - internal
    depends_on:
      - freezerguard

  freezerguard-worker:
    image: freezerguard:local
    container_name: vps_freezerguard_worker
    restart: unless-stopped
    command: php artisan queue:work --sleep=3 --tries=3
    env_file:
      - ./proyectos/FreezerGuard/.env
    volumes:
      - ./proyectos/FreezerGuard:/var/www/html
    networks:
      - freezerguard
      - internal
    depends_on:
      - freezerguard

  deploy-service:
    build:
      context: ./deploy-service
      dockerfile: Dockerfile

    container_name: vps_deploy_service

    restart: unless-stopped

    environment:
      PORT: 3000
      DEPLOY_TOKEN: ${DEPLOY_TOKEN}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET}

    volumes:
      - ./deploy-queue:/queue

    networks:
      - internal

    expose:
      - "3000"

  smee-client:
    image: node:20-alpine
    container_name: vps_smee_client
    restart: unless-stopped
    command: npx -y smee-client -u https://smee.io/Vxu7SLbrAl7xvld -t http://deploy-service:3000/github-webhook
    depends_on:
      - deploy-service
    networks:
      - internal

networks:
  proxy:

  internal:

  freezerguard:

volumes:

  freezerguard_app: